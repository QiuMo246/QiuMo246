# 放到你的同名仓库里，路径必须是：.github/workflows/snake.yml
# 作用：每天自动把你的贡献格子图生成一条贪吃蛇动画，输出到 output 分支
name: generate snake

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 0 点（北京时间早上 8 点）自动更新
  workflow_dispatch:       # 允许手动触发
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 生成贪吃蛇 SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: QiuMo246
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: 推送到 output 分支
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
